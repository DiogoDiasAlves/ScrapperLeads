# Sobe duas coisas:
#   - o scraper (gosom/google-maps-scraper), API em http://localhost:8080
#   - a página do ScrapperLeads, em http://localhost:3000
# Nenhum dos dois tem senha, então as portas ficam presas ao 127.0.0.1 (só esta máquina acessa).
# NÃO troque para 0.0.0.0 sem colocar uma proteção na frente (ex.: Cloudflare Access).

services:
  google-maps-scraper:
    # Pinned to a known-good release for reproducibility (bump deliberately).
    # The published image is linux/amd64. On Apple Silicon (M1/M2/M3) it runs under
    # emulation; if it won't start, UNCOMMENT the 'platform' line below.
    # Bumped from v1.15.0 on 2026-09-23: that build's embedded Playwright driver
    # (1.57.0) 404s on Microsoft's CDN (old driver builds get purged). v1.18.1 ships
    # a driver version still hosted.
    image: gosom/google-maps-scraper:v1.18.1
    # platform: linux/amd64
    container_name: gmaps-scraper
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    environment:
      - DISABLE_TELEMETRY=1      # não envia estatísticas de uso para fora
    ports:
      - "127.0.0.1:8080:8080"   # localhost only — see warning above
    volumes:
      - gmaps_data:/gmapsdata    # job results persist here
      - gmaps_cache:/opt         # Playwright browser cache (faster restarts)

  web:
    image: python:3.12-slim
    container_name: scrapperleads-web
    restart: unless-stopped
    depends_on:
      - google-maps-scraper
    working_dir: /app
    command: ["python", "-u", "web/app.py"]
    environment:
      - SCRAPER_BASE_URL=http://google-maps-scraper:8080
      - DATA_DIR=/app/leads
      - HOST=0.0.0.0             # dentro do container; a porta abaixo continua só local
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./web:/app/web:ro
      - ./leads:/app/leads       # as planilhas aparecem na pasta leads/ do projeto

volumes:
  gmaps_data:
  gmaps_cache:
